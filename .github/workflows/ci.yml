# Intégration continue : à chaque envoi de code, GitHub lance les tests,
# l'entraînement du modèle et la construction de l'image Docker.

name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe Python avec un cache des dépendances
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest

      - name: Entraîner le modèle
        run: python scripts/entrainer.py

  image-docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      # Vérifie que l'image se construit (l'entraînement a lieu pendant la construction)
      - name: Construire l'image Docker
        run: docker build -t classification-tumeurs .
